name: apk-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'include/**'
      - '.github/workflows/apk-smoke.yml'

env:
  LLAMA_CPP_REPO: https://github.com/ggml-org/llama.cpp
  LLAMA_CPP_SHA: 6e60f35608ec6918b44a9839c0c433687165f086
  # x86_64 for the smoke test — GitHub's free runners are x86_64 and
  # KVM-accelerated arm64 emulation is not available. Real releases
  # are built for arm64-v8a by android.yml.
  SMOKE_ABI: x86_64
  ANDROID_API: 24

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache llama.cpp source + build
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-${{ env.LLAMA_CPP_SHA }}-${{ env.SMOKE_ABI }}-ndk26.1.10909125-cmake3.22.1-v1

      - name: Clone llama.cpp (pinned)
        run: |
          if [ ! -d llama.cpp/.git ]; then
            git clone "$LLAMA_CPP_REPO" llama.cpp
          fi
          cd llama.cpp
          git fetch --tags origin
          git checkout "$LLAMA_CPP_SHA"

      - name: Configure llama.cpp for x86_64
        run: |
          cd llama.cpp
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$SMOKE_ABI \
            -DANDROID_PLATFORM=android-$ANDROID_API \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_OPENMP=OFF

      - name: Build libllama.so
        run: |
          cd llama.cpp
          cmake --build build-android --target llama -j

      - name: Copy native libs (x86_64)
        run: |
          set -euo pipefail
          DEST=android/app/src/main/jniLibs/$SMOKE_ABI
          mkdir -p "$DEST"
          for f in libllama.so libggml.so libggml-base.so libggml-cpu.so; do
            src=$(find llama.cpp/build-android -name "$f" -type f | head -1)
            [ -n "$src" ] || { echo "::error::missing $f"; exit 1; }
            cp "$src" "$DEST/"
            test -s "$DEST/$f" || { echo "::error::empty: $f"; exit 1; }
          done
          ls -lh "$DEST/"

      - name: Copy llama headers
        run: |
          set -euo pipefail
          DEST=android/app/src/main/jni/llama_include
          mkdir -p "$DEST"
          cp llama.cpp/include/llama.h "$DEST/llama.h"
          cp llama.cpp/ggml/include/ggml.h "$DEST/ggml.h"
          for h in ggml-alloc ggml-backend ggml-cpu gguf; do
            cp "llama.cpp/ggml/include/$h.h" "$DEST/$h.h" 2>/dev/null || true
          done
          test -s "$DEST/llama.h" || { echo "::error::missing llama.h"; exit 1; }

      # The app's build.gradle restricts ABI to arm64-v8a.
      # Override it for the smoke test so we can run on x86_64.
      - name: Patch build.gradle for x86_64 smoke
        run: |
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters '$SMOKE_ABI'/" android/app/build.gradle
          grep abiFilters android/app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK (x86_64)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -no-metrics
          script: |
            set -e
            adb wait-for-device
            adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 1; done'
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.xenonlabs.app/.MainActivity
            sleep 8
            PID=$(adb shell pidof com.xenonlabs.app || true)
            if [ -z "$PID" ]; then
                echo "FAIL: process not running"
                adb logcat -d | tail -200
                exit 1
            fi
            echo "PASS: pid=$PID"
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
                echo "FAIL: crash detected"
                adb logcat -d | grep -A 30 "FATAL EXCEPTION"
                exit 1
            fi
            echo "PASS: no fatal exceptions"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-apk-x86_64
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
