plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xenonlabs.app'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.xenonlabs.app"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "3.0.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        debug {
            storeFile file('xenon-debug.keystore')
            storePassword 'xenondebug'
            keyAlias 'xenon'
            keyPassword 'xenondebug'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // Preserve prebuilt llama.cpp libraries. Stripping them
            // can silently remove the .so files from the APK.
            keepDebugSymbols += [
                '**/libllama.so',
                '**/libggml.so',
                '**/libggml-base.so',
                '**/libggml-cpu.so',
                '**/libc++_shared.so',
                '**/libxenonlabs_jni.so'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
}
