<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1116">
<title>XenonLabs</title>

<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="vendor/icons-fonts.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.css">
<link rel="stylesheet" href="vendor/fontawesome.min.css">
<link rel="stylesheet" href="vendor/highlight-dark.css">
<link rel="stylesheet" href="vendor/inter.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="xl-app">

<div id="island" class="xl-island">
    <div class="xl-island-inner">
        <span id="islandIcon" class="xl-island-icon"></span>
        <span id="islandText" class="xl-island-text">XenonLabs</span>
        <span id="islandStatus" class="xl-island-status"></span>
    </div>
</div>

<main class="xl-main">

    <!-- ==================== CHAT ==================== -->
    <section id="view-chat" class="xl-view active">
        <header class="xl-chat-header">
            <button type="button" id="sidebarBtn" class="xl-header-btn" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="xl-header-model" id="headerModel">
                <span class="dot"></span><span>No model</span>
            </div>
            <button type="button" id="newChatBtn" class="xl-header-btn" aria-label="New chat">
                <i class="fa-solid fa-plus"></i>
            </button>
        </header>

        <div id="messages" class="xl-messages"></div>

        <div class="xl-composer">
            <form id="composer" autocomplete="off">
                <textarea id="prompt" rows="1" placeholder="Message Xenon" aria-label="Message"></textarea>
                <button id="send" type="submit" class="xl-send-btn" aria-label="Send" disabled>
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </form>
        </div>
    </section>

    <!-- ==================== MODELS ==================== -->
    <section id="view-models" class="xl-view">
        <header class="xl-chat-header">
            <div class="xl-header-spacer"></div>
            <div class="xl-header-title">Models</div>
            <button type="button" id="refreshModelsBtn" class="xl-header-btn" aria-label="Refresh">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </header>
        <div class="xl-scroll">
            <div id="modelList" class="xl-model-list"></div>
            <div class="xl-gap"></div>
        </div>
    </section>

    <!-- ==================== SETTINGS ==================== -->
    <section id="view-settings" class="xl-view">
        <header class="xl-chat-header">
            <div class="xl-header-spacer"></div>
            <div class="xl-header-title">Settings</div>
            <div class="xl-header-spacer"></div>
        </header>

        <div class="xl-scroll">

            <h6 class="xl-section">Generation</h6>
            <div class="xl-card">
                <div class="xl-row"><span><i class="fa-solid fa-hashtag xl-row-icon"></i>Max tokens</span><output id="oMax">256</output></div>
                <input type="range" id="sMax" min="32" max="2048" step="32" value="256" class="form-range">

                <div class="xl-row"><span><i class="fa-solid fa-temperature-half xl-row-icon"></i>Temperature</span><output id="oTemp">0.70</output></div>
                <input type="range" id="sTemp" min="0" max="150" step="1" value="70" class="form-range">

                <div class="xl-row"><span><i class="fa-solid fa-filter xl-row-icon"></i>Top-p</span><output id="oTopP">0.95</output></div>
                <input type="range" id="sTopP" min="1" max="100" step="1" value="95" class="form-range">

                <div class="xl-row"><span><i class="fa-solid fa-list-ol xl-row-icon"></i>Top-k</span><output id="oTopK">40</output></div>
                <input type="range" id="sTopK" min="0" max="100" step="1" value="40" class="form-range">

                <div class="xl-row"><span><i class="fa-solid fa-repeat xl-row-icon"></i>Repeat penalty</span><output id="oRep">1.10</output></div>
                <input type="range" id="sRep" min="100" max="150" step="1" value="110" class="form-range">
            </div>

            <h6 class="xl-section">Performance</h6>
            <div class="xl-card">
                <div class="xl-row"><span><i class="fa-solid fa-microchip xl-row-icon"></i>Threads</span><output id="oThreads">4</output></div>
                <input type="range" id="sThreads" min="1" max="8" step="1" value="4" class="form-range">

                <div class="xl-row"><span><i class="fa-solid fa-window-maximize xl-row-icon"></i>Context size</span><output id="oCtx">2048</output></div>
                <input type="range" id="sCtx" min="512" max="8192" step="512" value="2048" class="form-range">

                <div class="xl-row"><span><i class="fa-solid fa-seedling xl-row-icon"></i>Random seed</span><output id="oSeed">-1</output></div>
                <input type="range" id="sSeed" min="-1" max="9999" step="1" value="-1" class="form-range">
            </div>

            <h6 class="xl-section">Appearance</h6>
            <div class="xl-card">
                <div class="xl-row"><span><i class="fa-solid fa-circle-half-stroke xl-row-icon"></i>Theme</span></div>
                <div class="xl-segment" id="themeSegment">
                    <button data-theme="dark" class="active">Slate</button>
                    <button data-theme="darker">Ink</button>
                    <button data-theme="blue">Mist</button>
                </div>

                <div class="xl-row" style="margin-top:14px;">
                    <span><i class="fa-solid fa-code xl-row-icon"></i>Render Markdown</span>
                    <label class="xl-switch"><input type="checkbox" id="swMarkdown" checked><i></i></label>
                </div>

                <div class="xl-row">
                    <span><i class="fa-solid fa-wand-magic-sparkles xl-row-icon"></i>Streaming</span>
                    <label class="xl-switch"><input type="checkbox" id="swStream" checked><i></i></label>
                </div>
            </div>

            <h6 class="xl-section">System prompt</h6>
            <div class="xl-card">
                <div class="xl-presets" id="sysPresets">
                    <button class="xl-chip" data-preset="You are Xenon, a helpful on-device AI assistant. Be clear, concise, and accurate. When unsure, say so.">Default</button>
                    <button class="xl-chip" data-preset="You are a senior software engineer. Provide correct, minimal, runnable code. Prefer clarity over cleverness. Explain only what is non-obvious.">Coder</button>
                    <button class="xl-chip" data-preset="You are a patient teacher. Explain concepts step by step with concrete examples. Ask clarifying questions if the topic is ambiguous.">Teacher</button>
                    <button class="xl-chip" data-preset="You are a careful research assistant. Answer with evidence, cite assumptions, and note where certainty ends.">Researcher</button>
                    <button class="xl-chip" data-preset="You are a creative writing partner. Write vivid, sensory prose. Match the user's tone and genre.">Writer</button>
                    <button class="xl-chip" data-preset="You are a professional editor. Rewrite user text for clarity and tone. Preserve meaning. Show the revised version only.">Editor</button>
                    <button class="xl-chip" data-preset="Answer in under 20 words. Be direct. No preamble.">Terse</button>
                    <button class="xl-chip" data-preset="You are a Socratic tutor. Guide the user with questions instead of giving answers directly.">Socratic</button>
                </div>
                <textarea id="sSystem" rows="5" class="form-control xl-textarea">You are Xenon, a helpful on-device AI assistant. Be clear, concise, and accurate. When unsure, say so.</textarea>
            </div>

            <button id="save" class="xl-save">
                <i class="fa-solid fa-floppy-disk"></i> Save settings
            </button>
            <div id="savedMsg" class="xl-hint"></div>

            <h6 class="xl-section">Danger zone</h6>
            <div class="xl-card">
                <button id="clearHistory" class="xl-danger"><i class="fa-solid fa-trash"></i> Clear all conversations</button>
                <button id="resetSettings" class="xl-danger" style="margin-top:8px;"><i class="fa-solid fa-rotate-left"></i> Reset to defaults</button>
            </div>

            <div class="xl-gap"></div>
        </div>
    </section>

</main>

<nav class="xl-tabbar">
    <button data-tab="chat" class="xl-tab active"><i class="fa-solid fa-comment"></i><span>Chat</span></button>
    <button data-tab="models" class="xl-tab"><i class="fa-solid fa-cube"></i><span>Models</span></button>
    <button data-tab="settings" class="xl-tab"><i class="fa-solid fa-sliders"></i><span>Settings</span></button>
</nav>

<div id="sidebarScrim" class="xl-scrim" hidden></div>

<aside id="sidebar" class="xl-sidebar" hidden>
    <div class="xl-sidebar-head">
        <div class="xl-sidebar-brand">
            <div class="xl-avatar">X</div>
            <div>
                <div class="xl-sidebar-name">XenonLabs</div>
                <div class="xl-sidebar-sub">Local LLM on device</div>
            </div>
        </div>
        <button id="sidebarNewChat" class="xl-sidebar-new">
            <i class="fa-solid fa-plus"></i> New chat
        </button>
    </div>
    <div class="xl-sidebar-section-title">Recent</div>
    <div id="historyList" class="xl-history"></div>
    <div class="xl-sidebar-foot">
        <div id="sidebarModel" class="xl-sidebar-model">
            <i class="fa-solid fa-circle-notch"></i> No model loaded
        </div>
    </div>
</aside>

<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
