name: android-apk

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

env:
  LLAMA_CPP_REPO: https://github.com/ggml-org/llama.cpp
  LLAMA_CPP_SHA: 6e60f35608ec6918b44a9839c0c433687165f086
  ANDROID_ABI: arm64-v8a
  ANDROID_API: 24

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache llama.cpp source + build
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-${{ env.LLAMA_CPP_SHA }}-${{ env.ANDROID_ABI }}-ndk26.1.10909125-cmake3.22.1-v1

      - name: Clone llama.cpp (pinned)
        run: |
          if [ ! -d llama.cpp/.git ]; then
            git clone "$LLAMA_CPP_REPO" llama.cpp
          fi
          cd llama.cpp
          git fetch --tags origin
          git checkout "$LLAMA_CPP_SHA"
          git rev-parse HEAD

      - name: Configure llama.cpp
        run: |
          cd llama.cpp
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ANDROID_ABI \
            -DANDROID_PLATFORM=android-$ANDROID_API \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_OPENMP=OFF

      - name: Build libllama.so + friends
        run: |
          cd llama.cpp
          cmake --build build-android --target llama -j

      - name: Copy native libs
        run: |
          set -euo pipefail
          DEST=android/app/src/main/jniLibs/$ANDROID_ABI
          mkdir -p "$DEST"

          echo "--- .so files produced by llama.cpp ---"
          find llama.cpp/build-android -name '*.so' -type f | sort

          for f in libllama.so libggml.so libggml-base.so libggml-cpu.so; do
            src=$(find llama.cpp/build-android -name "$f" -type f | head -1)
            if [ -z "$src" ]; then
              echo "::error::required library not produced: $f"
              exit 1
            fi
            cp "$src" "$DEST/"
            test -s "$DEST/$f" || { echo "::error::empty file: $DEST/$f"; exit 1; }
          done

          ls -lh "$DEST/"

      - name: Copy llama headers
        run: |
          set -euo pipefail
          DEST=android/app/src/main/jni/llama_include
          mkdir -p "$DEST"

          cp llama.cpp/include/llama.h "$DEST/llama.h"

          # Every ggml*.h + gguf.h.
          cp llama.cpp/ggml/include/ggml*.h "$DEST/" 2>/dev/null || true
          cp llama.cpp/ggml/include/gguf.h  "$DEST/" 2>/dev/null || true

          # Stragglers that might live elsewhere.
          for h in ggml-opt.h ggml-alloc.h ggml-backend.h ggml-cpu.h \
                   ggml-metal.h ggml-cuda.h ggml-vulkan.h ggml-opencl.h; do
            [ -f "$DEST/$h" ] && continue
            find llama.cpp -name "$h" -type f -not -path '*/build-*' \
              -exec cp {} "$DEST/" \; 2>/dev/null || true
          done

          test -s "$DEST/llama.h"    || { echo "::error::missing llama.h";    exit 1; }
          test -s "$DEST/ggml.h"     || { echo "::error::missing ggml.h";     exit 1; }
          test -s "$DEST/ggml-opt.h" || { echo "::error::missing ggml-opt.h"; exit 1; }

          echo "--- headers copied ---"
          ls "$DEST/" | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xenonlabs-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
