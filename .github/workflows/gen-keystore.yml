name: gen-keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
              -keystore xenon-release.jks \
              -alias xenon \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass xenonlabs2026 \
              -keypass  xenonlabs2026 \
              -dname "CN=XenonLabs, OU=Android, O=XenonLabs, L=Unknown, ST=Unknown, C=IN"
          ls -lh xenon-release.jks

      - name: Encode as base64
        run: |
          base64 -w0 xenon-release.jks > xenon-jks.b64
          echo "=== BEGIN BASE64 (copy everything between the markers) ==="
          cat xenon-jks.b64
          echo
          echo "=== END BASE64 ==="
          echo
          echo "size: $(wc -c < xenon-jks.b64) bytes"

      - name: Upload as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: xenon-release-keystore
          path: xenon-release.jks
          retention-days: 7
