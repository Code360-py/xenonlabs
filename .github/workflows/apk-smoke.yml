name: apk-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache llama.cpp
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-android-arm64-v12

      - name: Clone llama.cpp
        run: |
          if [ ! -d llama.cpp ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp
          fi

      - name: Configure llama.cpp
        run: |
          cd llama.cpp
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_OPENMP=OFF

      - name: Build libllama.so
        run: |
          cd llama.cpp
          cmake --build build-android --target llama -j

      - name: Copy native libs
        run: |
          DEST=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $DEST
          cp llama.cpp/build-android/bin/libllama.so     $DEST/
          cp llama.cpp/build-android/bin/libggml.so      $DEST/
          cp llama.cpp/build-android/bin/libggml-base.so $DEST/
          cp llama.cpp/build-android/bin/libggml-cpu.so  $DEST/
          ls -lh $DEST/

      - name: Copy llama headers
        run: |
          DEST=android/app/src/main/jni/llama_include
          mkdir -p $DEST
          cp llama.cpp/include/llama.h     $DEST/ 2>/dev/null || true
          cp llama.cpp/include/llama-cpp.h $DEST/ 2>/dev/null || true
          cp llama.cpp/ggml/include/gguf.h $DEST/ 2>/dev/null || true
          find llama.cpp/ggml -name 'ggml*.h' -exec cp {} $DEST/ \;

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator and run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -e
            echo "--- waiting for device ---"
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            echo "--- installing APK ---"
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            echo "--- clearing logcat ---"
            adb logcat -c
            echo "--- launching app ---"
            adb shell am start -n com.xenonlabs.app/.MainActivity
            echo "--- waiting 8 s ---"
            sleep 8
            echo "--- is process alive? ---"
            PID=$(adb shell pidof com.xenonlabs.app || true)
            if [ -z "$PID" ]; then
                echo "FAIL: process not running"
                adb logcat -d | tail -200
                exit 1
            fi
            echo "PASS: pid=$PID"
            echo "--- screenshot ---"
            adb exec-out screencap -p > /tmp/screen.png || true
            echo "--- logcat tail ---"
            adb logcat -d -t 200
            echo "--- checking for FATAL EXCEPTION ---"
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
                echo "FAIL: crash detected in logcat"
                adb logcat -d | grep -A 30 "FATAL EXCEPTION"
                exit 1
            fi
            echo "PASS: no fatal exceptions"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: /tmp/screen.png
          if-no-files-found: ignore
          retention-days: 7
