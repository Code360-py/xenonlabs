<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>XenonLabs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- =============== Dynamic Island / top notch =============== -->
<div id="island" class="island">
    <div class="island-inner">
        <span id="islandIcon" class="island-icon"></span>
        <span id="islandText" class="island-text">XenonLabs</span>
        <span id="islandStatus" class="island-status"></span>
    </div>
</div>

<!-- =============== Views =============== -->
<main id="views">

    <section id="view-chat" class="view active">
        <div id="messages" class="messages"></div>

        <div class="composer-wrap">
            <form id="composer" class="composer" autocomplete="off">
                <button type="button" id="sidebarBtn" class="icon-btn" aria-label="Menu">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                </button>
                <textarea id="prompt" rows="1" placeholder="Message" aria-label="Message"></textarea>
                <button id="send" type="submit" class="send-btn" aria-label="Send">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4l8 8-8 8-1.4-1.4L16.2 13H4v-2h12.2L10.6 5.4 12 4z"/></svg>
                </button>
            </form>
        </div>
    </section>

    <section id="view-models" class="view">
        <div class="scroll">
            <div class="section-title">Models</div>
            <div id="modelList" class="model-list"></div>
        </div>
    </section>

    <section id="view-settings" class="view">
        <div class="scroll">
            <div class="section-title">Generation</div>
            <div class="card">
                <div class="row"><span>Max tokens</span><output id="oMax">256</output></div>
                <input type="range" id="sMax" min="32" max="1024" step="32" value="256">

                <div class="row"><span>Temperature</span><output id="oTemp">0.70</output></div>
                <input type="range" id="sTemp" min="0" max="150" step="1" value="70">

                <div class="row"><span>Top-p</span><output id="oTopP">0.95</output></div>
                <input type="range" id="sTopP" min="1" max="100" step="1" value="95">

                <div class="row"><span>Top-k</span><output id="oTopK">40</output></div>
                <input type="range" id="sTopK" min="0" max="100" step="1" value="40">
            </div>

            <div class="section-title">System prompt</div>
            <div class="card">
                <textarea id="sSystem" rows="4">You are a helpful assistant.</textarea>
            </div>

            <button id="save" class="primary-btn">Save</button>
            <div id="savedMsg" class="hint"></div>
            <div class="footer-space"></div>
        </div>
    </section>

</main>

<!-- =============== Floating sidebar =============== -->
<div id="sidebarScrim" class="sidebar-scrim" hidden></div>

<aside id="sidebar" class="sidebar" hidden>
    <div class="sidebar-head">
        <div class="sidebar-avatar">X</div>
        <div class="sidebar-name">XenonLabs</div>
        <div class="sidebar-sub">Local LLM on device</div>
    </div>

    <nav class="sidebar-nav">
        <button class="sidebar-item" data-nav="chat">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 4h16a1 1 0 011 1v11a1 1 0 01-1 1H8l-4 4V5a1 1 0 011-1z"/></svg>
            <span>Chat</span>
        </button>
        <button class="sidebar-item" data-nav="models">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/></svg>
            <span>Models</span>
        </button>
        <button class="sidebar-item" data-nav="settings">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
            <span>Settings</span>
        </button>
    </nav>

    <div class="sidebar-foot">
        <div id="sidebarModel" class="sidebar-model">No model loaded</div>
    </div>
</aside>

<!-- =============== Bottom floating tabs =============== -->
<nav class="tabbar">
    <div class="tabbar-inner">
        <button data-tab="chat" class="tab active" aria-label="Chat">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 4h16a1 1 0 011 1v11a1 1 0 01-1 1H8l-4 4V5a1 1 0 011-1z"/></svg>
            <span>Chat</span>
        </button>
        <button data-tab="models" class="tab" aria-label="Models">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2l9 5v10l-9 5-9-5V7l9-5zm0 2.3L5 8v8l7 4 7-4V8l-7-3.7z"/></svg>
            <span>Models</span>
        </button>
        <button data-tab="settings" class="tab" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7zm8-3.5a7.6 7.6 0 00-.1-1.2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 00-2.1-1.2L15 3h-4l-.4 2.6c-.75.3-1.45.7-2.1 1.2l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 000 2.4l-2 1.5 2 3.4 2.3-.9c.65.5 1.35.9 2.1 1.2L11 21h4l.4-2.6c.75-.3 1.45-.7 2.1-1.2l2.3.9 2-3.4-2-1.5c.07-.4.1-.8.1-1.2z"/></svg>
            <span>Settings</span>
        </button>
    </div>
</nav>

<script src="app.js"></script>
</body>
</html>
