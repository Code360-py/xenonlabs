name: apk-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'include/**'
      - '.github/workflows/apk-smoke.yml'

env:
  LLAMA_CPP_REPO: https://github.com/ggml-org/llama.cpp
  LLAMA_CPP_SHA: 6e60f35608ec6918b44a9839c0c433687165f086
  ANDROID_ABI: arm64-v8a
  ANDROID_API: 24

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache llama.cpp source + build
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-${{ env.LLAMA_CPP_SHA }}-${{ env.ANDROID_ABI }}-ndk26.1.10909125-cmake3.22.1-v2

      - name: Clone llama.cpp (pinned)
        run: |
          if [ ! -d llama.cpp/.git ]; then
            git clone "$LLAMA_CPP_REPO" llama.cpp
          fi
          cd llama.cpp
          git fetch --tags origin
          git checkout "$LLAMA_CPP_SHA"

      - name: Configure llama.cpp
        run: |
          cd llama.cpp
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ANDROID_ABI \
            -DANDROID_PLATFORM=android-$ANDROID_API \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_OPENMP=OFF

      - name: Build libllama.so
        run: |
          cd llama.cpp
          cmake --build build-android --target llama -j

      - name: Copy native libs
        run: |
          set -euo pipefail
          DEST=android/app/src/main/jniLibs/$ANDROID_ABI
          mkdir -p "$DEST"
          for f in libllama.so libggml.so libggml-base.so libggml-cpu.so; do
            src=$(find llama.cpp/build-android -name "$f" -type f | head -1)
            [ -n "$src" ] || { echo "::error::missing $f"; exit 1; }
            cp "$src" "$DEST/"
            test -s "$DEST/$f" || { echo "::error::empty: $f"; exit 1; }
          done
          ls -lh "$DEST/"

      - name: Copy llama headers
        run: |
          set -euo pipefail
          DEST=android/app/src/main/jni/llama_include
          mkdir -p "$DEST"
          cp llama.cpp/include/llama.h "$DEST/llama.h"
          cp llama.cpp/ggml/include/ggml.h "$DEST/ggml.h"
          for h in ggml-alloc ggml-backend ggml-cpu gguf; do
            cp "llama.cpp/ggml/include/$h.h" "$DEST/$h.h" 2>/dev/null || true
          done
          test -s "$DEST/llama.h" || { echo "::error::missing llama.h"; exit 1; }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Smoke test — inspect APK
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          ls -lh "$APK"

          echo
          echo "=== 1. APK is well-formed ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK" \
            | grep -E "^package|launchable-activity|native-code"

          echo
          echo "=== 2. Native libs are packaged ==="
          unzip -l "$APK" | grep -E "\.so$" | tee /tmp/so-list.txt
          for lib in lib/arm64-v8a/libllama.so \
                     lib/arm64-v8a/libggml.so \
                     lib/arm64-v8a/libxenonlabs_jni.so; do
            if ! grep -q "$lib" /tmp/so-list.txt; then
              echo "::error::missing $lib in APK"
              exit 1
            fi
          done

          echo
          echo "=== 3. JNI symbols are exported ==="
          # extract libxenonlabs_jni.so and check its exported symbols
          mkdir -p /tmp/apk-extract
          unzip -o "$APK" lib/arm64-v8a/libxenonlabs_jni.so -d /tmp/apk-extract >/dev/null
          NM=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          $NM -D /tmp/apk-extract/lib/arm64-v8a/libxenonlabs_jni.so > /tmp/syms.txt
          for sym in \
              Java_com_xenonlabs_app_MainActivity_nativeInit \
              Java_com_xenonlabs_app_MainActivity_nativeShutdown \
              Java_com_xenonlabs_app_MainActivity_nativeGenerateStream \
              Java_com_xenonlabs_app_MainActivity_nativeCancelGeneration \
              Java_com_xenonlabs_app_MainActivity_nativeContinueContext \
              Java_com_xenonlabs_app_MainActivity_nativeResetContext \
              Java_com_xenonlabs_app_MainActivity_nativeStatusString ; do
            if ! grep -q " $sym\$" /tmp/syms.txt; then
              echo "::error::missing symbol: $sym"
              echo "--- symbols found ---"
              grep Java_ /tmp/syms.txt || true
              exit 1
            fi
          done
          echo "All 7 JNI entry points present."

          echo
          echo "=== 4. libxenonlabs_jni.so depends on the expected libs ==="
          READELF=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          $READELF -d /tmp/apk-extract/lib/arm64-v8a/libxenonlabs_jni.so \
            | grep NEEDED || true

          echo
          echo "PASS: APK smoke test"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-apk-arm64
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
